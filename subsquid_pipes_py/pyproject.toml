[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "subsquid-pipes"
version = "0.1.0"
description = "Python runtime SDK for Subsquid Pipes"
authors = [{name = "Subsquid", email = "hello@subsquid.io"}]
license = {text = "MIT"}
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "anyio>=4.2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pytest>=9.0.1",
  "structlog>=24.1",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]
clickhouse = ["clickhouse-connect>=0.6"]
drizzle = ["asyncpg>=0.29"]
tests = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["subsquid_pipes"]
